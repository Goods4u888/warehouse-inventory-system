<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="landing">
  <button class="btn btn-ghost btn-sm landing-lang" id="lang-toggle" data-icon="globe" aria-label="Switch language"><span id="lang-toggle-label">EN</span></button>

  <div class="landing-inner">
    <div class="landing-title" data-i18n="landingTitle">Warehouse Inventory</div>
    <div class="landing-subtitle" data-i18n="landingSubtitle">Receiving · Requisition</div>

    <div class="landing-cards">
      <a class="landing-card" href="request.html">
        <span class="landing-card-icon" data-icon="send" data-icon-size="26"></span>
        <div class="landing-card-title" data-i18n="landingRequesterTitle">Request form</div>
        <div class="landing-card-desc" data-i18n="landingRequesterDesc">Fill out a request and get a reference number — no login needed.</div>
      </a>
      <a class="landing-card" href="admin.html">
        <span class="landing-card-icon" data-icon="sliders" data-icon-size="26"></span>
        <div class="landing-card-title" data-i18n="landingAdminTitle">Admin</div>
        <div class="landing-card-desc" data-i18n="landingAdminDesc">Stock, receiving, scanning, requests, and reports. Staff login required.</div>
      </a>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script>
  document.documentElement.lang = I18n.current;
  I18n.applyStatic();
  applyStaticIcons();
  document.getElementById('lang-toggle').addEventListener('click', () => {
    I18n.setLang(I18n.current === 'th' ? 'en' : 'th');
  });
</script>
</body>
</html>
