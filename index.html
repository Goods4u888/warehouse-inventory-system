<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Oswald:wght@500&display=swap">

<link rel="stylesheet" href="css/tokens.css?v=20260909t">
<link rel="stylesheet" href="css/app.css?v=20260909t">
</head>
<body class="hub-page">

<div class="cine-backdrop" aria-hidden="true">
  <div class="cine-spotlight"></div>
  <svg class="cine-racking" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="cineFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
        <stop offset="100%" stop-color="currentColor" stop-opacity=".4"/>
      </linearGradient>
    </defs>
    <g stroke="url(#cineFade)" stroke-width="3">
      <line x1="60" y1="260" x2="60" y2="20"/>
      <line x1="180" y1="260" x2="180" y2="60"/>
      <line x1="300" y1="260" x2="300" y2="10"/>
      <line x1="900" y1="260" x2="900" y2="10"/>
      <line x1="1020" y1="260" x2="1020" y2="60"/>
      <line x1="1140" y1="260" x2="1140" y2="20"/>
    </g>
    <g stroke="url(#cineFade)" stroke-width="2">
      <line x1="20" y1="90" x2="340" y2="90"/>
      <line x1="20" y1="150" x2="340" y2="150"/>
      <line x1="20" y1="210" x2="340" y2="210"/>
      <line x1="860" y1="90" x2="1180" y2="90"/>
      <line x1="860" y1="150" x2="1180" y2="150"/>
      <line x1="860" y1="210" x2="1180" y2="210"/>
    </g>
  </svg>
</div>

<div class="app" style="max-width:720px">

  <header class="header landing-header" style="position:static">
    <span></span>
    <div class="header-brand">
      <img class="header-logo" src="img/logo-property-office.png" alt="">
      <div class="header-title" data-i18n="landingTitle">Warehouse Inventory</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="lang-toggle" data-icon="globe" data-icon-size="14" aria-label="Switch language"><span id="lang-toggle-label">EN</span></button>
    </div>
  </header>

  <main>
    <p class="cine-tag">Warehouse Operations</p>
    <p class="eyebrow" data-i18n="landingEyebrow">Receiving · Requisition</p>

    <div class="hub-grid">
      <a class="hub-tile" href="request.html">
        <span class="hub-tile-icon" data-icon="send" data-icon-size="24"></span>
        <span class="chip chip-ok"><span data-icon="checkCircle" data-icon-size="11"></span><span data-i18n="landingBadgeNoLogin">No login required</span></span>
        <span class="hub-tile-title" data-i18n="landingRequesterTitle">Request form</span>
        <span class="hub-tile-desc" data-i18n="landingRequesterDesc">Search the catalog and say how many, describe what you need, or both.</span>
        <span class="hub-tile-cta"><span data-i18n="landingEnter">Open the form</span><span data-icon="arrowRight" data-icon-size="14"></span></span>
      </a>
      <a class="hub-tile" href="admin.html">
        <span class="hub-tile-icon" data-icon="sliders" data-icon-size="24"></span>
        <span class="chip chip-neutral"><span data-icon="lock" data-icon-size="11"></span><span data-i18n="landingBadgeLoginRequired">Staff login required</span></span>
        <span class="hub-tile-title" data-i18n="landingAdminTitle">Admin</span>
        <span class="hub-tile-desc" data-i18n="landingAdminDesc">Stock, receiving, scanning, requests, and reports in one place.</span>
        <span class="hub-tile-cta"><span data-i18n="landingEnterAdmin">Sign in</span><span data-icon="arrowRight" data-icon-size="14"></span></span>
      </a>
    </div>
  </main>
</div>

<div class="app-version no-print">v20260909t</div>

<script src="js/i18n.js?v=20260909t"></script>
<script src="js/icons.js?v=20260909t"></script>
<script>
  document.documentElement.lang = I18n.current;
  I18n.applyStatic();
  applyStaticIcons();
  document.getElementById('lang-toggle').addEventListener('click', () => {
    I18n.setLang(I18n.current === 'th' ? 'en' : 'th');
  });
</script>
</body>
</html>
